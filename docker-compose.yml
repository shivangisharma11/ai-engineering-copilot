
services:
  postgres:
    image: postgres:16
    container_name: ai-copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot_user
      POSTGRES_PASSWORD: mind@123
      POSTGRES_DB: copilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot_user -d copilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
